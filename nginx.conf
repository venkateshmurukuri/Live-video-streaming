worker_processes auto;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application hls {
            live on;
            record off;

            hls on;
            hls_path /tmp/hls;
            hls_nested on;
            # 2 s fragments line up with the encoder's 2 s GOP, so every segment starts on a keyframe.
            hls_fragment 2s;
            hls_playlist_length 12s;

            # Local demo: anyone who can reach port 1935 may publish. Restrict this before exposing it.
            allow publish all;
        }
    }
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 80;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /hls {
            root /tmp;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            # Playlists change every fragment; segments are short-lived, so neither is cached.
            add_header Cache-Control no-cache always;
            # The player is served by the app on another port, so it fetches HLS cross-origin.
            add_header Access-Control-Allow-Origin * always;
        }
    }
}
