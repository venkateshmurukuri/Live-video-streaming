spring.application.name=live-video-streaming
server.port=${PORT:8080}

# FFmpeg binary; a bare name is looked up on PATH.
stream.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
# auto picks dshow (Windows), avfoundation (macOS) or v4l2 (Linux); "test" needs no camera.
stream.capture-format=${CAPTURE_FORMAT:auto}
stream.default-destination=${DEFAULT_DESTINATION:rtmp://localhost:1935/hls/cam}

stream.fps=30
stream.video-size=1280x720
stream.video-bitrate-kbps=2000

# Relaunch FFmpeg on failure after 1s, 2s, 4s, 8s, 15s, then give up.
# A run longer than 30s counts as healthy and resets that budget.
stream.max-retries=5
stream.initial-backoff-ms=1000
stream.max-backoff-ms=15000
stream.stable-run-ms=30000

logging.level.com.video.stream.webcam=INFO
