<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam to HLS</title>
    <link rel="stylesheet" href="css/player.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
<div class="container">
    <header>
        <h1>Webcam &rarr; RTMP &rarr; HLS</h1>
        <p>FFmpeg capture, nginx-rtmp packaging, hls.js playback</p>
    </header>

    <section class="panel">
        <h2>Stream</h2>
        <div class="control-panel">
            <div class="input-group">
                <label for="device">Capture device</label>
                <input type="text" id="device" placeholder="loading…">
                <small id="deviceHint" class="hint"></small>
            </div>
            <div class="input-group">
                <label for="destination">RTMP destination</label>
                <input type="text" id="destination" placeholder="rtmp://localhost:1935/hls/cam">
                <small class="hint">The last path segment is the stream name the player fetches.</small>
            </div>
            <div class="button-group">
                <button id="startBtn" class="btn btn-primary">Start stream</button>
                <button id="stopBtn" class="btn btn-danger" disabled>Stop stream</button>
            </div>
        </div>

        <h3>Status</h3>
        <div class="status-card">
            <div class="status-item"><span class="label">State</span><span id="state" class="value">&mdash;</span></div>
            <div class="status-item"><span class="label">Stream ID</span><span id="streamId" class="value">&mdash;</span></div>
            <div class="status-item"><span class="label">Started</span><span id="startedAt" class="value">&mdash;</span></div>
            <div class="status-item"><span class="label">Retries</span><span id="retryCount" class="value">&mdash;</span></div>
            <div class="status-item"><span class="label">Last error</span><span id="lastError" class="value">&mdash;</span></div>
        </div>
    </section>

    <section class="panel">
        <h2>Player</h2>
        <div class="player-container">
            <video id="video" controls muted playsinline width="640" height="360"></video>
        </div>
        <div class="control-group">
            <label for="hlsUrl">HLS URL</label>
            <input type="text" id="hlsUrl" placeholder="http://localhost:8082/hls/cam/index.m3u8">
            <button id="loadBtn" class="btn btn-success">Load</button>
        </div>
    </section>

    <section class="panel">
        <h3>Log</h3>
        <div id="log" class="log-container"></div>
        <button id="clearLogBtn" class="btn btn-secondary">Clear</button>
    </section>
</div>

<script src="js/player.js"></script>
</body>
</html>
