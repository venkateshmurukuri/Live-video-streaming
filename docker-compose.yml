services:
  nginx-rtmp:
    image: tiangolo/nginx-rtmp
    container_name: nginx-rtmp
    ports:
      - "1935:1935"   # RTMP ingest
      - "8082:80"     # HLS over HTTP
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  # `docker compose --profile demo up --build` runs the whole chain with the synthetic test source.
  # A container cannot see your webcam; for a real camera run the app on the host (./run.sh).
  app:
    build: .
    profiles: ["demo"]
    ports:
      - "8080:8080"
    environment:
      CAPTURE_FORMAT: test
      DEFAULT_DESTINATION: rtmp://nginx-rtmp:1935/hls/demo
    depends_on:
      - nginx-rtmp
